name: In the Neighborhood
options:
  bundleIdPrefix: com.in-the-neighborhood
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  xcodeVersion: "16.0"

packages:
  llama:
    path: .
    # Using local Package.swift which references ggml-org/llama.cpp b7658 xcframework
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.6

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

schemes:
  InTheNeighborhood:
    build:
      targets:
        InTheNeighborhood: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - InTheNeighborhoodTests
        - MetasearchCoreTests
        - SearchSourcesTests
        - LocationServicesTests
        - LLMIntegrationTests
        - InTheNeighborhoodUITests
    archive:
      config: Release

targets:
  # Main App Target
  InTheNeighborhood:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: Sources/InTheNeighborhood
    resources:
      - path: Sources/InTheNeighborhood/Resources/Localizable.strings
    dependencies:
      - target: MetasearchCore
      - target: SearchSources
      - target: LocationServices
      - target: LLMIntegration
      # Explicitly add llama package dependency to ensure framework is embedded
      - package: llama
        product: LlamaFramework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood
        PRODUCT_NAME: In the Neighborhood
        PRODUCT_MODULE_NAME: InTheNeighborhood
        EXECUTABLE_NAME: InTheNeighborhood
        INFOPLIST_FILE: Sources/InTheNeighborhood/Info.plist
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: KA5A6NN3PD
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # API Keys - values come from xcconfig files or build environment variables
        # These are inherited from the xcconfig files
        # Add API keys to Info.plist so they can be accessed at runtime
        INFOPLIST_KEY_BING_API_KEY: $(BING_API_KEY)
        INFOPLIST_KEY_BESTBUY_API_KEY: $(BESTBUY_API_KEY)
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
    info:
      path: Sources/InTheNeighborhood/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: In the Neighborhood
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        LSRequiresIPhoneOS: true
        # API Keys - injected from xcconfig files via build settings
        # These use $(BING_API_KEY) which is resolved
        # from Config/Debug.xcconfig or Config/Release.xcconfig at build time
        BING_API_KEY: $(BING_API_KEY)
        BESTBUY_API_KEY: $(BESTBUY_API_KEY)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "In the Neighborhood uses your location to find nearby local merchants and calculate distances."
        NSLocationAlwaysAndWhenInUseUsageDescription: "In the Neighborhood uses your location to find nearby local merchants and calculate distances."
        UIBackgroundModes:
          - fetch

  # MetasearchCore Framework
  MetasearchCore:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/MetasearchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.MetasearchCore
        SWIFT_VERSION: "6.0"
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  # SearchSources Framework
  SearchSources:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/SearchSources
    dependencies:
      - target: MetasearchCore
      - target: LocationServices
      - package: SwiftSoup
        product: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.SearchSources
        SWIFT_VERSION: "6.0"
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  # LocationServices Framework
  LocationServices:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/LocationServices
    dependencies:
      - framework: Foundation
      - framework: CoreLocation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.LocationServices
        SWIFT_VERSION: "6.0"
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  # LLMIntegration Framework
  LLMIntegration:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/LLMIntegration
    dependencies:
      - target: MetasearchCore
      - package: llama
        product: LlamaFramework
    frameworks:
      - Accelerate.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.LLMIntegration
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  # Test Targets
  InTheNeighborhoodTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/InTheNeighborhoodTests
    dependencies:
      - target: InTheNeighborhood
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.InTheNeighborhoodTests
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        TEST_TARGET_NAME: InTheNeighborhood
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/In the Neighborhood.app/InTheNeighborhood
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: KA5A6NN3PD

  MetasearchCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/MetasearchCoreTests
    dependencies:
      - target: MetasearchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.MetasearchCoreTests
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  SearchSourcesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/SearchSourcesTests
    dependencies:
      - target: SearchSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.SearchSourcesTests
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  LocationServicesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/LocationServicesTests
    dependencies:
      - target: LocationServices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.LocationServicesTests
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  LLMIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/LLMIntegrationTests
    dependencies:
      - target: LLMIntegration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.LLMIntegrationTests
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: KA5A6NN3PD

  InTheNeighborhoodUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/InTheNeighborhoodUITests
    dependencies:
      - target: InTheNeighborhood
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.InTheNeighborhoodUITests
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_VERSION: "6.0"
        # Note: SWIFT_OBJC_INTEROP_MODE removed - UI test target doesn't need C++ interop
        # and it was causing XCUIApplication() initialization to crash
        # TEST_TARGET_NAME tells Xcode which app bundle to launch for UI tests
        TEST_TARGET_NAME: InTheNeighborhood
        # UI tests must NOT have TEST_HOST or BUNDLE_LOADER set - explicitly clear them
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: KA5A6NN3PD
