name: In the Neighborhood
options:
  bundleIdPrefix: com.in-the-neighborhood
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad
    PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.$(PRODUCT_NAME:rfc1034identifier)
    SWIFT_OPTIMIZATION_LEVEL: "-Onone" # Debug only, Release will override
    GCC_OPTIMIZATION_LEVEL: 0 # Debug only
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
    SWIFT_COMPILATION_MODE: singlefile
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: KA5A6NN3PD
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  Release:
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    GCC_OPTIMIZATION_LEVEL: s
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
    SWIFT_COMPILATION_MODE: wholemodule

schemes:
  InTheNeighborhood:
    build:
      targets:
        InTheNeighborhood: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - InTheNeighborhoodTests
        - MetasearchCoreTests
        - SearchSourcesTests
        - LocationServicesTests
        - LLMIntegrationTests
    archive:
      config: Release

targets:
  # Main App Target
  InTheNeighborhood:
    type: application
    platform: iOS
    sources:
      - path: Sources/InTheNeighborhood
    dependencies:
      - target: MetasearchCore
      - target: SearchSources
      - target: LocationServices
      - target: LLMIntegration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood
        PRODUCT_NAME: In the Neighborhood
        PRODUCT_MODULE_NAME: InTheNeighborhood
        EXECUTABLE_NAME: InTheNeighborhood
        INFOPLIST_FILE: Sources/InTheNeighborhood/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Sources/InTheNeighborhood/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: In the Neighborhood
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "In the Neighborhood uses your location to find nearby local merchants and calculate distances."
        NSLocationAlwaysAndWhenInUseUsageDescription: "In the Neighborhood uses your location to find nearby local merchants and calculate distances."

  # MetasearchCore Framework
  MetasearchCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/MetasearchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.MetasearchCore
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  # SearchSources Framework
  SearchSources:
    type: framework
    platform: iOS
    sources:
      - path: Sources/SearchSources
    dependencies:
      - target: MetasearchCore
      - target: LocationServices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.SearchSources
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  # LocationServices Framework
  LocationServices:
    type: framework
    platform: iOS
    sources:
      - path: Sources/LocationServices
    dependencies:
      - framework: Foundation
      - framework: CoreLocation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.LocationServices
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  # LLMIntegration Framework
  LLMIntegration:
    type: framework
    platform: iOS
    sources:
      - path: Sources/LLMIntegration
    dependencies:
      - target: MetasearchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.LLMIntegration
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  # Test Targets
  InTheNeighborhoodTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/InTheNeighborhoodTests
    dependencies:
      - target: InTheNeighborhood
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.InTheNeighborhoodTests
        TEST_TARGET_NAME: InTheNeighborhood
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/In the Neighborhood.app/InTheNeighborhood
        GENERATE_INFOPLIST_FILE: YES

  MetasearchCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MetasearchCoreTests
    dependencies:
      - target: MetasearchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.MetasearchCoreTests
        GENERATE_INFOPLIST_FILE: YES

  SearchSourcesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SearchSourcesTests
    dependencies:
      - target: SearchSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.SearchSourcesTests
        GENERATE_INFOPLIST_FILE: YES

  LocationServicesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LocationServicesTests
    dependencies:
      - target: LocationServices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.LocationServicesTests
        GENERATE_INFOPLIST_FILE: YES

  LLMIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LLMIntegrationTests
    dependencies:
      - target: LLMIntegration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.LLMIntegrationTests
        GENERATE_INFOPLIST_FILE: YES
