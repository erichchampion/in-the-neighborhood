name: In the Neighborhood
options:
  bundleIdPrefix: com.in-the-neighborhood
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: en
  xcodeVersion: "16.0"

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: KA5A6NN3PD

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.6

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

schemes:
  InTheNeighborhood:
    build:
      targets:
        InTheNeighborhood: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - InTheNeighborhoodTests
        - MetasearchCoreTests
        - SearchSourcesTests
        - LocationServicesTests
        - InTheNeighborhoodUITests
    archive:
      config: Release

targets:
  # Main App Target
  InTheNeighborhood:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: Sources/InTheNeighborhood
    resources:
      - path: Sources/InTheNeighborhood/Resources/Localizable.strings
      - path: Sources/InTheNeighborhood/Resources/EthicsLedger.json
    dependencies:
      - target: MetasearchCore
      - target: SearchSources
      - target: LocationServices
      - target: SharedModels
      - target: NearbyStoresWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood
        PRODUCT_NAME: In the Neighborhood
        PRODUCT_MODULE_NAME: InTheNeighborhood
        EXECUTABLE_NAME: InTheNeighborhood
        INFOPLIST_FILE: Sources/InTheNeighborhood/Info.plist
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # API Keys - values come from xcconfig files or build environment variables
        # These are inherited from the xcconfig files
        # Add API keys to Info.plist so they can be accessed at runtime
        INFOPLIST_KEY_BING_API_KEY: $(BING_API_KEY)
        INFOPLIST_KEY_BESTBUY_API_KEY: $(BESTBUY_API_KEY)
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
    info:
      path: Sources/InTheNeighborhood/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: In the Neighborhood
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        LSRequiresIPhoneOS: true
        # API Keys - injected from xcconfig files via build settings
        # These use $(BING_API_KEY) which is resolved
        # from Config/Debug.xcconfig or Config/Release.xcconfig at build time
        BING_API_KEY: $(BING_API_KEY)
        BESTBUY_API_KEY: $(BESTBUY_API_KEY)
        DPLA_API_KEY: $(DPLA_API_KEY)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "In the Neighborhood uses your location to find nearby local merchants and calculate distances."
        NSLocationAlwaysAndWhenInUseUsageDescription: "In the Neighborhood uses your location to find nearby local merchants and calculate distances."
        NSCameraUsageDescription: "In the Neighborhood uses the camera to scan product barcodes so it can find the item at local and ethical retailers."
        UIBackgroundModes:
          - fetch
    entitlements:
      path: Sources/InTheNeighborhood/InTheNeighborhood.entitlements
      properties:
        com.apple.security.application-groups: ["group.com.in-the-neighborhood.shared"]

  # MetasearchCore Framework
  MetasearchCore:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/MetasearchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.MetasearchCore
        SWIFT_VERSION: "6.0"
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  # SearchSources Framework
  SearchSources:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/SearchSources
    dependencies:
      - target: MetasearchCore
      - target: LocationServices
      - package: SwiftSoup
        product: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.SearchSources
        SWIFT_VERSION: "6.0"
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  # LocationServices Framework
  LocationServices:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/LocationServices
    dependencies:
      - framework: Foundation
      - framework: CoreLocation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.LocationServices
        SWIFT_VERSION: "6.0"
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true


  # SharedModels Framework (accessed by both app and widget)
  SharedModels:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/SharedModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.SharedModels
        SWIFT_VERSION: "6.0"
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  # Widget Extension
  NearbyStoresWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/NearbyStoresWidget
    dependencies:
      - target: MetasearchCore
      - target: SharedModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.NearbyStoresWidget
        PRODUCT_MODULE_NAME: NearbyStoresWidget
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Sources/NearbyStoresWidget/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
    info:
      path: Sources/NearbyStoresWidget/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Sources/NearbyStoresWidget/NearbyStoresWidget.entitlements
      properties:
        com.apple.security.application-groups: ["group.com.in-the-neighborhood.shared"]

  # Test Targets
  InTheNeighborhoodTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/InTheNeighborhoodTests
    dependencies:
      - target: InTheNeighborhood
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.InTheNeighborhoodTests
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        TEST_TARGET_NAME: InTheNeighborhood
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/In the Neighborhood.app/InTheNeighborhood
        GENERATE_INFOPLIST_FILE: YES

  MetasearchCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/MetasearchCoreTests
    dependencies:
      - target: MetasearchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.MetasearchCoreTests
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  SearchSourcesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/SearchSourcesTests
    dependencies:
      - target: SearchSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.SearchSourcesTests
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  LocationServicesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/LocationServicesTests
    dependencies:
      - target: LocationServices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.LocationServicesTests
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES


  InTheNeighborhoodUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/InTheNeighborhoodUITests
    dependencies:
      - target: InTheNeighborhood
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.in-the-neighborhood.InTheNeighborhoodUITests
        PRODUCT_NAME: $(TARGET_NAME)
        SWIFT_VERSION: "6.0"
        # Note: SWIFT_OBJC_INTEROP_MODE removed - UI test target doesn't need C++ interop
        # and it was causing XCUIApplication() initialization to crash
        # TEST_TARGET_NAME tells Xcode which app bundle to launch for UI tests
        TEST_TARGET_NAME: InTheNeighborhood
        # UI tests must NOT have TEST_HOST or BUNDLE_LOADER set - explicitly clear them
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        GENERATE_INFOPLIST_FILE: YES
